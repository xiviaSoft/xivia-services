<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="XiviaSoft mark">
  <defs>
    <linearGradient id="xiviaRibbonA" x1="8" y1="10" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EB3C1"/>
      <stop offset="55%" stop-color="#1F8A9D"/>
      <stop offset="100%" stop-color="#146F7F"/>
    </linearGradient>
    <linearGradient id="xiviaRibbonB" x1="56" y1="10" x2="8" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8D8C8"/>
      <stop offset="50%" stop-color="#7FC4D4"/>
      <stop offset="100%" stop-color="#1F8A9D"/>
    </linearGradient>
    <radialGradient id="xiviaCore" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E8F7FA"/>
      <stop offset="100%" stop-color="#5EB3C1"/>
    </radialGradient>
    <filter id="xiviaSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="blur"/>
      <feOffset dy="0.5" result="offset"/>
      <feFlood flood-color="#146F7F" flood-opacity="0.18"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft glass plate -->
  <rect x="4" y="4" width="56" height="56" rx="18" fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.85)" stroke-width="1.25"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="15" fill="rgba(238,244,248,0.35)"/>

  <!-- Crossing ribbons = intention × craft -->
  <g filter="url(#xiviaSoft)">
    <path
      d="M18.5 16.5c1.8-1.8 4.7-1.8 6.5 0L47.5 39c1.8 1.8 1.8 4.7 0 6.5s-4.7 1.8-6.5 0L18.5 23c-1.8-1.8-1.8-4.7 0-6.5Z"
      fill="url(#xiviaRibbonA)"
      opacity="0.92"
    />
    <path
      d="M45.5 16.5c1.8 1.8 1.8 4.7 0 6.5L23 45.5c-1.8 1.8-4.7 1.8-6.5 0s-1.8-4.7 0-6.5L39 16.5c1.8-1.8 4.7-1.8 6.5 0Z"
      fill="url(#xiviaRibbonB)"
      opacity="0.9"
    />
  </g>

  <!-- Lumen core = insight becoming product -->
  <circle cx="32" cy="32" r="6.2" fill="url(#xiviaCore)" stroke="rgba(255,255,255,0.95)" stroke-width="1.4"/>
  <circle cx="30.6" cy="30.4" r="1.7" fill="rgba(255,255,255,0.85)"/>
</svg>
